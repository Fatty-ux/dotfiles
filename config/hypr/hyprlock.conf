# JoeOS lock screen (hyprlock)
# The wallpaper follows the desktop: Quickshell writes its path into this file whenever it changes.
source = ~/.config/hypr/hyprlock-wallpaper.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 2, smooth
}

# ---- Background: the desktop wallpaper, frosted ----
background {
    monitor =
    path = $wallpaper
    color = rgba(141821ff)          # shown if the wallpaper can't be loaded
    blur_passes = 3
    blur_size = 7
    brightness = 0.72
    vibrancy = 0.2
    noise = 0.02
}

# ---- Big clock ----
label {
    monitor =
    text = $TIME
    color = rgba(e6e9efff)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 230
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# ---- Date ----
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(e6e9efcc)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
}

# ---- Glassy card behind the password box ----
shape {
    monitor =
    size = 420, 190
    color = rgba(14182155)
    rounding = 30
    border_size = 1
    border_color = rgba(ffffff55)
    position = 0, -90
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
}

# ---- Greeting ----
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(e6e9efff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# ---- Password box (same glassy grey edge as the window borders) ----
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = -1
    outer_color = rgba(e6e9efcc) rgba(8b909bcc) 45deg
    inner_color = rgba(1d2230cc)
    font_color = rgba(e6e9efff)
    check_color = rgba(89b4faee) rgba(e6e9efcc) 45deg
    fail_color = rgba(f38ba8ee)
    capslock_color = rgba(f9e2afee)
    fade_on_empty = false
    placeholder_text = <span foreground="##9aa3b5">Password…</span>
    fail_text = <i>Wrong password ($ATTEMPTS)</i>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -110
    halign = center
    valign = center
}

# ---- Hint ----
label {
    monitor =
    text = Press Enter to unlock
    color = rgba(9aa3b5cc)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
