# kitty: JoeOS defaults. Colours come from the wallpaper (see colors-wallpaper.conf).

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Transparent window (Hyprland blurs what's behind it)
background_opacity         0.80
dynamic_background_opacity yes

# Look and feel
window_padding_width     14
cursor_shape             beam
confirm_os_window_close  0
enable_audio_bell        no
hide_window_decorations  yes
tab_bar_style            powerline
tab_powerline_style      round

# Lets Quickshell reload the colours when the wallpaper changes
allow_remote_control socket-only
listen_on            unix:/tmp/kitty-{kitty_pid}

# Colours generated from the current wallpaper by Quickshell
include colors-wallpaper.conf
